# Local Supabase configuration for Silver Care.
project_id = "silver-care"

[api]
port = 54321

[db]
port = 54322
major_version = 17

[auth]
site_url = "http://localhost:3000"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false
