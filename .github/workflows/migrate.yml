name: Migrate Supabase

# Migracje na zdalne bazy wyłącznie przez CI (nigdy z laptopa).
# push na staging → baza stagingowa; push na main → baza produkcyjna
# (środowisko "production" wymaga zatwierdzenia przez Required reviewers).
#
# Uruchomienie ręczne (workflow_dispatch) służy do diagnozy i naprawy historii migracji (#275):
#   dry_run         — db push tylko pokazuje, co by zastosował (domyślnie włączone);
#   repair_applied  — wersje oznaczane jako zastosowane BEZ wykonania pliku (supabase migration repair).
#                     Tylko gdy treść migracji jest już w bazie albo została w całości zastąpiona nowszą.
# Nigdy nie używamy db push --include-all: wykonuje starszy plik po nowszych i może cofnąć ich zmiany.
on:
  push:
    branches: [ main, staging ]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tylko pokaż, co db push by zastosował"
        type: boolean
        default: true
      repair_applied:
        description: "Wersje do oznaczenia jako zastosowane bez wykonania, oddzielone spacją (np. 20261030160000)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    # Migracje jednej bazy nigdy równolegle i nigdy nie anulowane w połowie.
    concurrency:
      group: migrate-${{ github.ref_name == 'main' && 'production' || 'staging' }}
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Historia migracji (repo i baza)
        run: supabase migration list --linked

      - name: Naprawa historii (tylko uruchomienie ręczne)
        if: github.event_name == 'workflow_dispatch' && inputs.repair_applied != ''
        env:
          REPAIR_VERSIONS: ${{ inputs.repair_applied }}
        run: |
          if ! [[ "$REPAIR_VERSIONS" =~ ^[0-9]{14}( [0-9]{14})*$ ]]; then
            echo "::error::repair_applied: wersje to 14 cyfr oddzielone spacją, np. 20261030160000"
            exit 1
          fi
          for v in $REPAIR_VERSIONS; do
            if ! ls supabase/migrations/${v}_*.sql >/dev/null 2>&1; then
              echo "::error::Brak pliku migracji dla wersji $v w supabase/migrations/"
              exit 1
            fi
            echo "Oznaczam $v jako zastosowaną (bez wykonania pliku)"
            supabase migration repair --linked --status applied "$v"
          done
          supabase migration list --linked

      - name: Push migrations
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            supabase db push --dry-run
          else
            supabase db push
          fi
