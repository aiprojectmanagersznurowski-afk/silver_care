name: Silver Care CI

on:
  push:
    branches: [ main, develop, "feature/**", "refactor/**" ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Silver Care Verification & Gate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key' }}
      PESEL_HASH_SALT: ${{ secrets.PESEL_HASH_SALT || 'ci-test-salt-32-chars-long-secret' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full Verification Gate (10/10 Stages + Linter + Next.js Build)
        run: bash scripts/verify.sh --full

  # Wdrożenie na Vercel tokenem właściciela projektu (VERCEL_TOKEN), niezależnie od autora commita.
  # Automatyczne wdrożenia z integracji Git są wyłączone w apps/web/vercel.json.
  # push na main → produkcja; PR z tego repozytorium → podgląd. Tylko po zielonej bramce.
  deploy:
    name: Vercel Deploy
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Build na serwerach Vercela, nie w Actions: zmienne typu Sensitive nie dają się pobrać
      # przez `vercel pull` (CLI wpisuje "[SENSITIVE]"), a build z --prebuilt wkompilował ten
      # napis jako adres Supabase — produkcja 500 od 2026-10-28. Sekrety nie opuszczają Vercela.
      # Bez .git: Vercel Hobby blokuje publikację, gdy autor commita (np. merge Darka) nie jest
      # w zespole Vercela — CLI wysyła metadane Gita z katalogu. Runner jest jednorazowy.
      - name: Deploy
        run: |
          rm -rf .git
          url=$(pnpm dlx vercel@65.5.0 deploy --yes $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "Wdrożenie ($TARGET): $url" >> "$GITHUB_STEP_SUMMARY"

      # Zielony job ma znaczyć działającą aplikację, nie tylko udaną publikację.
      # Podglądy są za ochroną Vercela (302), więc sprawdzamy stały adres produkcji.
      - name: Smoke test produkcji
        if: github.event_name == 'push'
        env:
          SMOKE_URL: https://silver-care-six.vercel.app/login
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SMOKE_URL")
            echo "próba $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$SMOKE_URL nie odpowiada 200 po publikacji — przywróć poprzednie wdrożenie (Instant Rollback)"
          exit 1
