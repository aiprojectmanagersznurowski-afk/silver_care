name: Silver Care CI

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Silver Care Verification & Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.24.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 1/6 Validate Contracts
        run: node tools/sc-validate.mjs

      - name: 2/6 Check Codegen Drift
        run: node tools/sc-codegen.mjs --check

      - name: 3/6 Check Core Naming
        run: node tools/sc-naming.mjs

      - name: 4/6 Verify Gate Rules (Selftest)
        run: node tools/sc-selftest.mjs

      - name: 5/6 Unit & Logic Tests
        run: pnpm test --run tests/logic/

      - name: 6/6 Full Verification Gate
        run: bash scripts/verify.sh
