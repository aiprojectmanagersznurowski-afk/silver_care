name: Silver Care CI

on:
  push:
    branches: [ main, staging, develop, "feature/**", "refactor/**" ]
  # Każdy PR z tego repozytorium, także w stosie (baza = inna gałąź funkcji). Nowe PR-y idą do staging,
  # promocja staging → main osobnym PR-em.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' }}

jobs:
  verify:
    name: Silver Care Verification & Gate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key' }}
      PESEL_HASH_SALT: ${{ secrets.PESEL_HASH_SALT || 'ci-test-salt-32-chars-long-secret' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full Verification Gate (10/10 Stages + Linter + Next.js Build)
        run: bash scripts/verify.sh --full

  # PR sprawdza kod. Wdrożenie wymaga uprawnień projektu Vercel.
  deploy:
    name: Vercel Deploy
    needs: verify
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'production' || 'staging (podgląd)' }}
      PROD_FLAG: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '--prod' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Build na serwerach Vercela, nie w Actions: zmienne typu Sensitive nie dają się pobrać
      # przez `vercel pull` (CLI wpisuje "[SENSITIVE]"), a build z --prebuilt wkompilował ten
      # napis jako adres Supabase — produkcja 500 od 2026-10-28. Sekrety nie opuszczają Vercela.
      # Staging zachowuje metadane commita do weryfikacji uprawnień przez Vercel.
      # Ścieżka produkcyjna zachowuje dotychczasowe przygotowanie katalogu.
      - name: Deploy
        id: deploy
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            rm -rf .git
          fi
          url=$(pnpm dlx vercel@65.5.0 deploy --yes $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "Wdrożenie ($TARGET): $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Zielony job ma znaczyć działającą aplikację, nie tylko udaną publikację.
      # Podglądy są za ochroną Vercela (302), więc sprawdzamy stały adres produkcji.
      - name: Smoke test produkcji
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SMOKE_URL: https://silver-care-six.vercel.app/login
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SMOKE_URL")
            echo "próba $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$SMOKE_URL nie odpowiada 200 po publikacji — przywróć poprzednie wdrożenie (Instant Rollback)"
          exit 1


  migrate_staging:
    name: Apply staging migrations
    needs: deploy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    uses: ./.github/workflows/migrate.yml
    secrets: inherit

  promote_staging:
    name: Promote staging alias
    needs: [deploy, migrate_staging]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Alias stagingu
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
        run: |
          host="${DEPLOY_URL#https://}"
          host="${host%/}"
          qs=""
          case "$VERCEL_ORG_ID" in team_*) qs="?teamId=$VERCEL_ORG_ID" ;; esac
          dpl_id=$(curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${host}${qs}" | jq -r '.id')
          if [ -z "$dpl_id" ] || [ "$dpl_id" = "null" ]; then
            echo "::error::Nie udało się pobrać ID wdrożenia dla $host"
            exit 1
          fi
          code=$(curl -sS -o /tmp/alias.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"alias":"silver-care-staging.vercel.app"}' \
            "https://api.vercel.com/v2/deployments/${dpl_id}/aliases${qs}")
          cat /tmp/alias.json
          echo ""
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Przypisanie aliasu zwróciło HTTP $code"
            exit 1
          fi
          echo "Alias stagingu: https://silver-care-staging.vercel.app" >> "$GITHUB_STEP_SUMMARY"
